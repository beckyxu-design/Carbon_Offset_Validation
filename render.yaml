services:
  - type: web
    name: carbon-offset-node-api
    env: node
    plan: free
    rootDir: carbon-offset-validator/server
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false

  - type: web
    name: carbon-offset-python-api
    env: python
    plan: free
    rootDir: carbon-offset-validator/server-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: LLM_API_URL
        value: https://api.openai.com/v1/chat/completions

  - type: web
    name: carbon-offset-frontend
    env: static
    rootDir: carbon-offset-validator
    buildCommand: bun install && bun run build
    staticPublishPath: dist
    envVars:
      - key: VITE_MAPBOX_TOKEN
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_PYTHON_API_URL
        sync: false
